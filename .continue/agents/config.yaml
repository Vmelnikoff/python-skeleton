name: Python Project Config
version: 1.0.0
schema: v1

models:
  # Основная модель для чата (быстрая)
  - name: 🚀 Qwen 7B (Чат)
    provider: ollama
    model: qwen2.5-coder:7b
    apiBase: http://localhost:11434
    roles: [ chat, edit, apply ]
    defaultCompletionOptions:
      temperature: 0.1

  # Мощная модель для сложных задач
  - name: 🧠 DeepSeek 16B (Мощный)
    provider: ollama
    model: deepseek-coder-v2:16b
    apiBase: http://localhost:11434
    roles: [chat, edit, apply]
    defaultCompletionOptions:
      temperature: 0.1

  # Автодополнения - Mellum 4B (полностью в RAM для экономии VRAM)
